[project]
name = "podcast-intelligence"
version = "0.1.0"
description = "Podcast ingestion, diarized transcription, summarization and grounded chat"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Podcast Intelligence contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "mcp[cli]>=1.27,<2",
  "numpy>=2.1,<3",
  "openai>=1.70,<3",
  "orjson>=3.10,<4",
  "pgvector>=0.3.6,<1",
  "prometheus-fastapi-instrumentator>=8.1,<9",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0.36,<3",
  "starlette>=1.3.1,<2",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pytest-mock>=3.14,<4",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
podcast-intelligence = "podcast_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_intelligence"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "celery.*",
  "feedparser.*",
  "mcp.*",
  "pgvector.*",
  "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
